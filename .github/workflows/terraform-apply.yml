name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

# Todos los valores de "vars." son GitHub Actions repository VARIABLES
# (Settings > Secrets and variables > Actions > Variables) - no son
# secretos, son config específica de este ambiente. Ver README.
env:
  AWS_REGION: us-east-1
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_AGENT }} # client_id de aws-azure-interconnect-agent (ver ci_identities.tf)
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VAR_azure_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_azure_vm_ssh_public_key: ${{ vars.AZURE_VM_SSH_PUBLIC_KEY }}

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_AGENT }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
