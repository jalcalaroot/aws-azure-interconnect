name: Terraform Validate

# Deliberately validate-only (fmt/validate/tflint/checkov) - no plan/apply
# here. This repo touches real AWS + Azure accounts and there's no OIDC/
# credentials wiring yet; a plan/apply workflow is out of scope until that's
# set up and reviewed on purpose, not an oversight.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write # upload the Checkov SARIF to the Security tab

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.15"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init + validate
        run: |
          terraform init -input=false -backend=false
          terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        env:
          # without this, `tflint --init` hits the GitHub API unauthenticated
          # (60 req/h per IP, shared by all runners) to download the plugins,
          # and gets rate-limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false # blocking - accepted findings are documented inline with #checkov:skip
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov results to the Security tab
        # also run when Checkov fails (that is when the SARIF matters most),
        # but not if an earlier step (tflint, validate) failed and Checkov
        # never ran.
        if: always() && steps.checkov.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
