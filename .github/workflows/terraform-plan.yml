name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "*.tf"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # required for OIDC authentication to AWS/Azure
  contents: read
  pull-requests: write # to comment the plan on the PR
  security-events: write # upload the Checkov SARIF to the Security tab

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# All "vars." values are GitHub Actions repository VARIABLES (Settings >
# Secrets and variables > Actions > Variables): environment config, not secrets.
env:
  AWS_REGION: us-east-1
  ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID_PLAN }} # client_id of the aws-azure-interconnect-plan identity (see ci_identities.tf)
  ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VAR_azure_subscription_id: ${{ vars.ARM_SUBSCRIPTION_ID }}
  TF_VAR_azure_vm_ssh_public_key: ${{ vars.AZURE_VM_SSH_PUBLIC_KEY }}

jobs:
  plan:
    name: Plan
    # Skipped (not failed) until the repository variables are configured.
    if: ${{ vars.AWS_ROLE_ARN_PLAN != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PLAN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.10"
          terraform_wrapper: false

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.3122.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: Upload Checkov results to the Security tab
        if: always() && steps.checkov.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif

      - name: Terraform plan
        id: plan
        shell: bash
        run: |
          set +e
          terraform plan -input=false -no-color -out=tfplan | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Comment the plan on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n\n... (output truncated)'
              : plan;

            const summaryMatch = plan.match(/Plan:\s*(\d+)\s*to add,\s*(\d+)\s*to change,\s*(\d+)\s*to destroy/);
            const destroyCount = summaryMatch ? parseInt(summaryMatch[3], 10) : 0;

            const warning = destroyCount > 0
              ? [
                  `> [!WARNING]`,
                  `> This plan **destroys or replaces ${destroyCount} resource${destroyCount === 1 ? '' : 's'}**. Review carefully before merging.`,
                  '',
                ]
              : [];

            const body = [
              '### Terraform Plan',
              '',
              ...warning,
              '<details><summary>Show plan</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `*Commit: ${context.sha.substring(0, 7)}*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const previous = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### Terraform Plan')
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if terraform plan failed
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1
