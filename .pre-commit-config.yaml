# Install: pip install pre-commit && pre-commit install (once per clone)
# Runs on every `git commit`, before the commit exists, so a secret never
# leaves the machine (unlike gitleaks in CI, which only catches it once it is
# on GitHub). terraform_fmt is free here and avoids CI fmt-check bounces.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
